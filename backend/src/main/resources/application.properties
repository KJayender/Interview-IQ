spring.application.name=interview-iq
server.port=${SERVER_PORT:8080}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/interview_iq?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jackson.serialization.write-dates-as-timestamps=false
app.jwt.secret=${JWT_SECRET:local-development-secret-change-this-to-at-least-32-characters}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.cors.origin=${FRONTEND_ORIGIN:http://localhost:5173}
app.gemini.api-key=${GEMINI_API_KEY:}
app.gemini.model=${GEMINI_MODEL:gemini-2.0-flash}
assessment.objective-weight=${ASSESSMENT_OBJECTIVE_WEIGHT:0.7}
assessment.written-weight=${ASSESSMENT_WRITTEN_WEIGHT:0.3}
assessment.strong-threshold=${SKILL_STRONG_THRESHOLD:80}
assessment.good-threshold=${SKILL_GOOD_THRESHOLD:60}
assessment.needs-threshold=${SKILL_NEEDS_THRESHOLD:40}
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
